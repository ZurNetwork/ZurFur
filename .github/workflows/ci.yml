name: CI

on:
  pull_request:
    # Base-branch filter: include feature/bug branches so STACKED PRs (a PR
    # targeting another PR's branch) run the same gate as PRs into main.
    branches: [main, "feature/**", "bug/**"]
  push:
    branches: [main]
  # The merge queue on main: every required check must also run on the
  # queue's group commit, or the queue waits until its check timeout.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the Rust, contract, web, ui and npm-lock jobs can skip:
  # only a pull request whose every changed path is docs-only
  # (scripts/ci-paths.sh) skips them. Fails closed: on a push, on any error, or
  # when the checked-out merge commit's parents are not exactly the PR's base
  # and head, `code`, `lock` and `npmlock` are true and everything runs
  # (scripts/ci-changes.sh). A merge-queue group always runs everything; only
  # its `lock` (whether Cargo advisories block) and `npmlock` (whether npm
  # advisories block: a change to an npm lockfile or a root osv-scanner.*.toml)
  # follow its paths. Dependents run unless `code` is exactly 'false', and each
  # flag counts as true unless it is exactly 'false', so a failed or cancelled
  # detection also runs everything. Nothing from the event reaches `run:`
  # text: the SHAs arrive through env.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      lock: ${{ steps.detect.outputs.lock }}
      npmlock: ${{ steps.detect.outputs.npmlock }}
    steps:
      # A PR: its test merge commit plus its two parents (base tip, PR head).
      # A merge group: its head with full history, which holds the group's
      # base however many queued PRs sit between them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
          persist-credentials: false
      - id: detect
        name: Classify the changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        # The detection is scripts/ci-changes.sh (tested by `just scripts-test`),
        # taken from the BASE commit so a PR can't rewrite the logic that decides
        # whether its own jobs run. No base copy, or anything else odd: run all.
        run: |
          result=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_EVENT_NAME" != merge_group ]; then
            echo "not a pull request or a merge group: run everything"
          elif printf '%s' "$BASE_SHA" | grep -qE '^[0-9a-f]{40}$' &&
               git show "$BASE_SHA:scripts/ci-changes.sh" > "$RUNNER_TEMP/ci-changes.sh" 2>/dev/null; then
            result=$(CI_CHANGES_TMP="$RUNNER_TEMP" sh "$RUNNER_TEMP/ci-changes.sh") || result=""
          else
            echo "::warning::changes: the base has no scripts/ci-changes.sh; running everything"
          fi
          code=true
          lock=true
          npmlock=true
          if printf '%s\n' "$result" | grep -qx 'code=false'; then code=false; fi
          if printf '%s\n' "$result" | grep -qx 'lock=false'; then lock=false; fi
          if printf '%s\n' "$result" | grep -qx 'npmlock=false'; then npmlock=false; fi
          echo "code=$code lock=$lock npmlock=$npmlock"
          printf 'code=%s\nlock=%s\nnpmlock=%s\n' "$code" "$lock" "$npmlock" >> "$GITHUB_OUTPUT"

  fmt:
    name: fmt
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain and components rust-toolchain.toml pins: one pin for
      # every machine and for CI.
      - run: rustup toolchain install --profile minimal
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      # Only main saves the cache; a PR restores main's and saves nothing, so
      # main's entry isn't evicted under the repository's cache cap.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --locked: build exactly what Cargo.lock pins (a git dep's locked SHA,
      # not a re-resolve of its tag); a stale lockfile fails loudly here.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The dev profile sits behind a feature no default build turns on, so it
      # is linted on its own (in its own target dir, as `just gate` does); the
      # test job runs its guard tests. scripts/dev-profile-pins.test.sh pins both.
      - run: CARGO_TARGET_DIR=target/dev-profile cargo clippy -p api --all-targets --locked --features dev-profile -- -D warnings

  test:
    name: test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      # The dev profile's locks and sessions, built with its feature.
      - run: CARGO_TARGET_DIR=target/dev-profile cargo test -p api --locked --features dev-profile --lib --test dev_profile

  # The npm lockfiles' advisory check and 7-day floor, judged by the BASE
  # commit's scripts/npm-lock-ci.sh with the base's tools, waivers and old
  # lockfiles, so a change can't loosen what judges it; the web, ui and
  # contract jobs wait for it. It runs node and nothing a change's build
  # config can steer: no Rust toolchain, no package install and no package
  # cache (setup-node's automatic one is switched off). Advisories
  # block when `npmlock` isn't exactly 'false', and only report otherwise; the
  # floor always blocks. scripts/npm-lock-pins.test.sh pins the job's shape,
  # and scripts/npm-lock-ci.test.sh runs this step against scratch repos.
  npm-lock:
    name: npm-lock
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.code != 'false' || needs.changes.outputs.npmlock != 'false') }}
    runs-on: ubuntu-latest
    steps:
      # A PR or a push: HEAD and its parents, the base among them. A merge
      # group: its head with full history, which holds the group's base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # The base is verified first: on a pull request or a push, HEAD^1 must
      # be it; on a merge group, an ancestor of HEAD. Then the base's driver
      # when it has one; only a verified base that lacks it runs this
      # change's own, with a warning. Anything odd exits 1.
      - name: The advisory check and the 7-day floor, with the base's tools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          NPM_LOCK_MODE: ${{ needs.changes.outputs.npmlock == 'false' && 'report' || 'block' }}
        run: |
          base="$BASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$(git rev-parse --verify --quiet 'HEAD^1') || base=""
          fi
          if ! printf '%s' "$base" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::npm-lock: the base SHA '$base' is not 40 lowercase hex digits"
            exit 1
          fi
          if ! git cat-file -e "$base^{commit}"; then
            echo "::error::npm-lock: the base commit $base is not in this checkout"
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request | push)
              parent1=$(git rev-parse --verify --quiet 'HEAD^1') || parent1=""
              if [ "$parent1" != "$base" ]; then
                echo "::error::npm-lock: HEAD^1 ($parent1) is not the base $base"
                exit 1
              fi
              ;;
            merge_group)
              if ! git merge-base --is-ancestor "$base" HEAD; then
                echo "::error::npm-lock: the merge group's base $base is not an ancestor of HEAD"
                exit 1
              fi
              ;;
            *)
              echo "::error::npm-lock: not a pull request, a merge group or a push (GITHUB_EVENT_NAME '$GITHUB_EVENT_NAME')"
              exit 1
              ;;
          esac
          if ! listing=$(git ls-tree --full-tree "$base" -- scripts/npm-lock-ci.sh); then
            echo "::error::npm-lock: can't read the base's tree"
            exit 1
          fi
          if [ -n "$listing" ]; then
            if ! git show "$base:scripts/npm-lock-ci.sh" > "$RUNNER_TEMP/npm-lock-ci.sh"; then
              echo "::error::npm-lock: can't read the base's scripts/npm-lock-ci.sh"
              exit 1
            fi
            driver="$RUNNER_TEMP/npm-lock-ci.sh"
          else
            echo "::warning::npm-lock: the base has no scripts/npm-lock-ci.sh; running this change's own"
            driver=scripts/npm-lock-ci.sh
          fi
          sh "$driver" "$base" "$NPM_LOCK_MODE"

  contract:
    name: contract
    needs: [changes, npm-lock]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.npm-lock.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Full history: `buf breaking --against` compares the PR's contract to
      # the base branch's, which needs the base ref fetched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned buf CLI (a Go binary; no JVM, no registry, no BUF_TOKEN — the
      # google/api deps are vendored in-tree). setup_only: install buf and
      # nothing else; the steps below run lint and breaking themselves.
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          version: '1.72.0'
          setup_only: true
      # Lint the corpus (STANDARD rules; see contract/buf.yaml).
      - run: buf lint contract
      # Frontend codegen drift (ZMVP-161): regenerate protobuf-es output and
      # fail on any drift — the committed generated TS must match the corpus.
      # (The backend's generated module is drift-checked by the cargo test
      # job's contract_current test; this is its frontend twin.)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      # The guarded install (`just frontend-install`); tools-check pins it.
      - run: node frontend/install-check.mjs
      - run: yarn --cwd frontend install --frozen-lockfile --ignore-scripts
      - run: node frontend/install-check.mjs --installed
      # Clean-slate regeneration, then diff the INDEX: a bare
      # `git diff --exit-code` on a warm tree sees only tracked-file edits —
      # blind to a file `buf generate` ADDS (new .proto ⇒ untracked _pb.ts,
      # green) and to a committed file it no longer writes (renamed .proto ⇒
      # orphaned _pb.ts, green forever). Wiping first makes the regenerated
      # tree the whole truth; `git add -A` + a cached diff then reports adds,
      # edits, and orphan deletions alike. The backend twin closes the same
      # holes by construction (contract_current's owned-set walk).
      - run: |
          rm -rf frontend/web/src/lib/server/api/generated
          (cd contract && buf generate)
          git add -A frontend/web/src/lib/server/api/generated
          git diff --cached --exit-code -- frontend/web/src/lib/server/api/generated
      # The breaking gate at WIRE_JSON (DD 40992770 decision 10): on PRs and
      # merge-queue groups, against the base branch. Once the first release
      # tag exists this gains a second comparison against the last released
      # tag (VERSIONING.md §2 "two gates, not one"). The pre-release period
      # ends at the first alpha tag (contract/lifecycle.toml); a pre-alpha tag
      # is not a release tag.
      # Bootstrap guard: a base that predates the corpus has nothing to
      # compare against (buf fails with "had no .proto files"), and skipping
      # is CORRECT there — the first corpus commit cannot break a contract
      # that does not exist yet.
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          # A merge group names its base as refs/heads/<branch>.
          BASE_REF: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          BASE_REF="${BASE_REF#refs/heads/}"
          # A base we can't read must fail, not pass as a bootstrap skip.
          if [ -z "$BASE_REF" ] || ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            echo "::error::contract: base branch origin/$BASE_REF not found"
            exit 1
          fi
          if git ls-tree -r "origin/$BASE_REF" --name-only | grep -q '^contract/.*\.proto$'; then
            buf breaking contract --against ".git#branch=origin/$BASE_REF,subdir=contract"
          else
            echo "base origin/$BASE_REF has no contract corpus (bootstrap) — breaking gate skipped"
          fi

  # Licences, bans and sources always count. Advisories count only when the
  # PR changes Cargo.lock (or detection can't tell); otherwise a newly
  # published advisory reports here without failing unrelated PRs, and the
  # daily Advisories workflow catches it on main.
  deny:
    name: deny
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --locked matches the other jobs' lockfile assertion; --all-features
      # scans the full feature graph, not just default features. MPL-2.0
      # (jacquard family) is Engineer-allowed in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          arguments: --locked --all-features
          command: check
          command-arguments: bans licenses sources
      - id: advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        continue-on-error: ${{ needs.changes.outputs.lock == 'false' }}
        with:
          arguments: --locked --all-features
          command: check
          command-arguments: advisories
      - if: ${{ steps.advisories.outcome == 'failure' }}
        run: |
          echo "::warning::deny: an advisory matches a dependency this PR does not change; reported, not blocking. The daily Advisories run on main tracks it."

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1

  nodes:
    name: nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.49.0'
      # The design corpus (ZurNetwork/zurfur-design) is a private sibling repo,
      # never checked out here — $ZURFUR_DESIGN_DIR stays absent in CI, so this
      # prints a skip notice rather than failing (see scripts/design-index-check.sh).
      - run: just design-index-check-test
      - run: just design-index-check
      # The pinned release binary (NODES_VERSION in the Justfile), then the
      # same check `just gate` runs: every NODE.inf.json and NODE.refs.json
      # against the schema, the tree and the design pointer index, then the
      # tree guards of scripts/nodes-tree-check.sh (no stray NODE.json, a node
      # tree here, every node file tracked; the runner's git and jq suffice).
      - run: just nodes-install
      - run: just nodes-check
      # TEMPORARY, like the script it tests: scripts/nodes-0-7-edits.sh (needs
      # the pinned nodes just installed, and the runner's jq).
      - run: sh scripts/nodes-0-7-edits.test.sh

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.49.0'
      # Fixture-driven; needs no live Claude session, no `nodes`/`jq` install
      # beyond what design-refs.sh's own tests stub or skip.
      - run: just hooks-test
      # Fixture tests for the CI path classifier, gate-light and pr-wait.
      - run: just scripts-test
      # Every action pinned to a commit SHA, and the workflows' typos,
      # cargo-deny and buf versions equal to the Justfile's pins; every
      # checkout without stored credentials, read-only top-level permissions,
      # no job-level permissions, no pull_request_target, no secrets, and
      # every yarn install frozen, script-free and guarded before and after.
      - run: just tools-check --pins-only
      # The TOML files the `changes` job lets skip the Rust jobs still parse.
      - run: just toml-check
      # No private working paper (rulings, queue, retros, releases) is tracked.
      - run: just private-papers-check
      # No .cargo/config[.toml] is tracked: one could run its own code in any cargo call.
      - run: just cargo-config-check

  web:
    name: web
    needs: [changes, npm-lock]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.npm-lock.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 (current LTS): vite 8 requires >= 20.19; spec-lint's pin stays untouched.
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      # The guarded install (`just frontend-install`), from the repo root;
      # tools-check pins it.
      - run: node frontend/install-check.mjs
        working-directory: .
      - run: yarn --cwd frontend install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: node frontend/install-check.mjs --installed
        working-directory: .
      # Chromium for the vitest browser-mode (component) test project.
      - run: yarn playwright install --with-deps chromium
      - run: yarn run check
      - run: yarn run lint
      - run: yarn run test
      - run: yarn run build

  # The @zurfur/ui component library: the install guard's own tests, then its
  # type check, lint, browser-mode component tests and gallery build.
  ui:
    name: ui
    needs: [changes, npm-lock]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.npm-lock.result == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      # The guarded install (`just frontend-install`), from the repo root;
      # tools-check pins it.
      - run: node frontend/install-check.mjs
        working-directory: .
      - run: yarn --cwd frontend install --frozen-lockfile --ignore-scripts
        working-directory: .
      - run: node frontend/install-check.mjs --installed
        working-directory: .
      - run: node --test frontend/install-check.test.mjs frontend/lock-review.test.mjs
        working-directory: .
      # Chromium for the vitest browser-mode (component) test project.
      - run: yarn playwright install --with-deps chromium
      - run: yarn run check
      - run: yarn run lint
      - run: yarn run test
      - run: yarn run build
