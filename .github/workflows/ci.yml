name: CI

on:
  pull_request:
    # Base-branch filter: include feature/bug branches so STACKED PRs (a PR
    # targeting another PR's branch) run the same gate as PRs into main.
    branches: [main, "feature/**", "bug/**"]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --locked: build exactly what Cargo.lock pins (a git dep's locked SHA,
      # not a re-resolve of its tag); a stale lockfile fails loudly here.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      # Full history: `buf breaking --against` compares the PR's contract to
      # the base branch's, which needs the base ref fetched.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned buf CLI (a Go binary; no JVM, no registry, no BUF_TOKEN — the
      # google/api deps are vendored in-tree).
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.72.0'
      # Lint the corpus (STANDARD rules; see contract/buf.yaml).
      - run: buf lint contract
      # Frontend codegen drift (ZMVP-161): regenerate protobuf-es output and
      # fail on any drift — the committed generated TS must match the corpus.
      # (The backend's generated module is drift-checked by the cargo test
      # job's contract_current test; this is its frontend twin.)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/web/yarn.lock
      - run: yarn --cwd frontend/web install --frozen-lockfile
      # Clean-slate regeneration, then diff the INDEX: a bare
      # `git diff --exit-code` on a warm tree sees only tracked-file edits —
      # blind to a file `buf generate` ADDS (new .proto ⇒ untracked _pb.ts,
      # green) and to a committed file it no longer writes (renamed .proto ⇒
      # orphaned _pb.ts, green forever). Wiping first makes the regenerated
      # tree the whole truth; `git add -A` + a cached diff then reports adds,
      # edits, and orphan deletions alike. The backend twin closes the same
      # holes by construction (contract_current's owned-set walk).
      - run: |
          rm -rf frontend/web/src/lib/server/api/generated
          (cd contract && buf generate)
          git add -A frontend/web/src/lib/server/api/generated
          git diff --cached --exit-code -- frontend/web/src/lib/server/api/generated
      # The breaking gate at WIRE_JSON (DD 40992770 decision 10): on PRs,
      # against the base branch. Once the first version tag exists this gains
      # a second comparison against the last released tag (VERSIONING.md §2
      # "two gates, not one").
      # Bootstrap guard: a base that predates the corpus has nothing to
      # compare against (buf fails with "had no .proto files"), and skipping
      # is CORRECT there — the first corpus commit cannot break a contract
      # that does not exist yet.
      - if: github.event_name == 'pull_request'
        run: |
          if git ls-tree -r "origin/${{ github.base_ref }}" --name-only | grep -q '^contract/.*\.proto$'; then
            buf breaking contract --against ".git#branch=origin/${{ github.base_ref }},subdir=contract"
          else
            echo "base origin/${{ github.base_ref }} has no contract corpus (bootstrap) — breaking gate skipped"
          fi

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Matches the lockfile-assertion convention the other jobs use.
          # --all-features: scan the full feature graph, not just default features.
          arguments: --locked --all-features
          # Full four-check set (advisories, licenses, bans, sources) —
          # all green: every workspace crate sets `publish = false`, and
          # MPL-2.0 (jacquard family) is Engineer-allowed in deny.toml.

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 (current LTS): vite 8 requires >= 20.19; spec-lint's pin stays untouched.
          node-version: '24'
          cache: yarn
          cache-dependency-path: frontend/web/yarn.lock
      - run: yarn install --frozen-lockfile
      # Chromium for the vitest browser-mode (component) test project.
      - run: yarn playwright install --with-deps chromium
      - run: yarn run check
      - run: yarn run lint
      - run: yarn run test
      - run: yarn run build
      # ZesTTY twins gate (ZMVP-177, DD 46596098 D2): twins current + types
      # clean, then the guards zts-check doesn't cover (orphan twins, .zts
      # outside src/, stale .zts-twins list). Mirrors `just zts-check`; the
      # checker is the npm exact-pinned devDependency installed above.
      - run: rm -rf .zts-check && npx --no-install zts-check .
      - run: bash ../../scripts/zts-twins.sh --guard
