name: Advisories

# The daily security-advisory check on main. PR CI blocks on advisories only
# when a PR changes Cargo.lock, so a newly published advisory against a
# dependency main already ships surfaces here, as a failed run. GitHub notifies
# the account that last edited this schedule.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.1 (cargo-deny 0.20.2)
        with:
          arguments: --locked --all-features
          command: check
          command-arguments: advisories
