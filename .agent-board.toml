# The internal team (the Engineer, 2026-10-10) makes the other teams' work easier:
# communication, way of working, CI/CD, and coding tools of its own making. It works
# by project, not by release (each project is a page under `.understand/internal/`),
# and appears in no release plan. It finds the most effective and efficient way for
# the teams to work: it reads the leads' retrospectives and the QA logs
# (`.understand/retros/`) and the board, and decides process refinements from
# them. It merges or splits teams as the data shows, and keeps that data (with CI
# and PR history) organized as statistics gathered by tools. Outside this repo it
# uses advisory locks, whose names must be slugs: `skills-<area>` (~/.claude/skills),
# `board-<area>` (~/code/ai/agent-message-board), `nodes-<area>` (~/code/nodes) and
# `kit-<area>` (~/code/ai/orchestration-kit).
[teams.internal]
mission = "Make the other teams' work easier: comms, way of working, CI/CD, tools"
owns = [
  ".github/**",
  "scripts/**",
  "Justfile",
  "CLAUDE.md",
  ".agent-board.toml",
  ".claude/settings.json",
]
lead = "lead"

# The compliance team (the Engineer, 2026-10-10): what Zurfur is legally bound to and
# must follow, such as privacy and data protection, age and adult-content rules,
# copyright and takedowns, payments and tax, accessibility and dependency licenses.
# Not a frequent team: it reviews at the end of every release, and the Orchestrator
# calls it in when a slice touches one of those areas. A legal must-fix blocks the
# release until it is fixed or the Engineer accepts the risk in writing. It owns no
# paths; its report goes to `.understand/releases/<version>/compliance.md`.
[teams.compliance]
mission = "Legal duties: privacy, age, copyright, payments, accessibility, licenses"
owns = []
lead = "lead"

# The architects team (the Engineer, 2026-10-10) reviews the whole project at the
# end of every release and requests the changes needed to follow correct
# architecture. Not a frequent team. Its requests go to
# `.understand/releases/<version>/architecture.md` and are planned into the next
# release; a request that would change a design ruling goes to the Engineer. It
# owns no paths.
[teams.architects]
mission = "Architecture review of the whole project at the end of every release"
owns = []
lead = "lead"

# The security team (the Engineer, 2026-10-10) reviews the whole system's security
# at the end of every release, and after every big merge: a feature branch merging
# into `main` when the feature touched authentication, the private/public data
# boundary, DID or handle correlation, sessions or tokens, plugin trust or the blob
# store. Per-slice security reviews still run as the Definition of Done requires;
# Heron, the team's lead, keeps doing them. A security must-fix blocks the release
# until it is fixed or the Engineer accepts the risk in writing. It owns no paths;
# its report goes to `.understand/releases/<version>/security.md`.
[teams.security]
mission = "Whole-system security review at the end of every release and after big merges"
owns = []
lead = "lead"

# Vulpes and Wolven live in their own repos, out of reach of this board's path
# locks, so they own no paths here; their agents use advisory locks named
# `vulpes:<path>` and `wolven:<path>`.
[teams.vulpes]
mission = "Vulpes (~/code/vulpes): ACP reference impl, upstream of Zurfur and Wolven"
owns = []
lead = "lead"

[teams.wolven]
mission = "Wolven (~/code/wolven): node graph and monotone policy fold over Vulpes"
owns = []
lead = "lead"
