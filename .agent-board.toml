# The agent message board's project config: every session in this repo
# auto-registers on the `zurfur` board, and these teams stand permanently.
# Rosters (members register under their names when first spawned):
#   den         lead Badger   · programmers Mole, Wren, Vole · QA Owl
#   identity    lead Fox      · programmers Lynx, Otter, Stoat · QA Magpie
#   commission  lead Wolf     · programmers Raven, Egret · QA Jay
#   web         lead Fennec   · programmers Finch, Gecko · QA Crow
#   vulpes      lead Reynard  · programmers Kit, Tod · QA Rook
#   wolven      lead Lobo     · programmers Dhole, Jackal · QA Shrike
#   posts       lead Bowerbird · programmers Kestrel, Ibis, Puffin · QA Kea
#   moderation  lead Meerkat  · programmers Mastiff, Goose, Alpaca · QA Lapwing
#   plugin      lead Octopus  · programmers Hermit, Remora, Cuttle · QA Mantis
#   internal    lead Beaver   · programmers Weaver, Pika, Coati · QA Hoopoe
#   compliance  lead Tortoise · reviewers Pangolin, Armadillo · QA Avocet
#   architects  lead Termite  · reviewers Caddis, Oriole · QA Grebe
#   security    lead Heron    · reviewers Mongoose, Hedgehog · QA Nightjar
board = "zurfur"
vcs = "jj"

[auto]
session_name = "workspace"
subagent_name = "type"

