// The Reason's v1 surface: creating, reading and changing Commissions.
//
// Only messages are generated; the service block declares routes only.
// Every vocabulary here is a STRING with the known values documented (R8)
// — the domain's state machines are the enforcement, the contract only
// says "this is this". Timestamps are `google.protobuf.Timestamp`: RFC
// 3339 on the wire, Z-normalized, byte-identical to what chrono already
// emits (VERSIONING.md §7.3).

syntax = "proto3";

package zurfur.api.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// `POST /api/v1/commissions` succeeds `201` with the created commission —
// the bare resource, flat, exactly as CreateAccountResponse renders its
// account (success bodies are bare resources, never wrapped). Minted at
// `/api/v1`; the pre-GA surface answered an empty `201`, leaving the creator
// unable to navigate to what it just made — a client can only act on what
// it is actually given. The content tree is deliberately absent, and so is
// `owner`: the caller is the owner.
message CreateCommissionResponse {
  // Opaque commission id (R6).
  string id = 1;
  // The commission's title.
  string title = 2;
  // Lifecycle step. Vocabulary (R8): `draft` | `batched` | `active` |
  // `completed` | `cancelled` | `disputed`.
  string lifecycle = 3;
  // Who may see it. Vocabulary (R8): `private` | `listed` | `public`.
  string visibility = 4;
  // The agreed deadline, if set. Absent = no deadline, nothing more (R4).
  optional google.protobuf.Timestamp deadline = 5;
  // The maturity posture, if rated.
  optional Maturity maturity = 6;
  // Direction axis of the two-dimensional status, if set (R8 vocabulary,
  // domain-enforced).
  optional string direction_status = 7;
  // Deadline axis of the two-dimensional status, if set (R8 vocabulary).
  optional string deadline_status = 8;
  // The external chat channel pointer, if one is linked.
  optional string linked_channel = 9;
  // When the commission was created.
  google.protobuf.Timestamp created_at = 10;
}

// A commission's maturity posture: the atproto self-label rating axis plus
// the orthogonal graphic flag.
message Maturity {
  // Extensible string vocabulary (R8): `safe` | `suggestive` | `nudity` |
  // `adult`. Domain-enforced; clients tolerate unknowns with a fallback.
  string rating = 1;
  // The orthogonal graphic-content flag.
  bool graphic = 2;
}

// `POST /api/v1/commissions` — the fixed metadata a caller supplies at birth.
message CreateCommissionRequest {
  // Required; a refused title → 422 with a field error at `#/title`.
  string title = 1;
  // Optional deadline.
  optional google.protobuf.Timestamp deadline = 2;
  // Optional at-birth maturity; same shape re-rating speaks later.
  optional Maturity maturity = 3;
}

// `PATCH /api/v1/commissions/{id}/title` — the owner renames the commission.
message RenameCommissionRequest {
  // Opaque commission id, from the path.
  string id = 1;
  // The new title. Required; a title the name rule refuses → 422 with a field error at `#/title`.
  string title = 2;
}

// `PATCH .../title` succeeds `200` with the renamed commission — the bare
// resource, field for field the shape CreateCommissionResponse renders, kept a
// separate message so each answer can evolve on its own. Its `title` is the
// title as stored: the name rule may strip characters, such as a zero-width
// space, from what was sent.
message RenameCommissionResponse {
  // Opaque commission id (R6).
  string id = 1;
  // The commission's title, as stored.
  string title = 2;
  // Lifecycle step. Vocabulary (R8): `draft` | `batched` | `active` |
  // `completed` | `cancelled` | `disputed`.
  string lifecycle = 3;
  // Who may see it. Vocabulary (R8): `private` | `listed` | `public`.
  string visibility = 4;
  // The agreed deadline, if set. Absent = no deadline, nothing more (R4).
  optional google.protobuf.Timestamp deadline = 5;
  // The maturity posture, if rated.
  optional Maturity maturity = 6;
  // Direction axis of the two-dimensional status, if set (R8 vocabulary).
  optional string direction_status = 7;
  // Deadline axis of the two-dimensional status, if set (R8 vocabulary).
  optional string deadline_status = 8;
  // The external chat channel pointer, if one is linked.
  optional string linked_channel = 9;
  // When the commission was created.
  google.protobuf.Timestamp created_at = 10;
}

// `GET /api/v1/commissions/{id}` — read one commission.
message GetCommissionRequest {
  // Opaque commission id, from the path.
  string id = 1;
}

// `GET .../{id}` succeeds `200` with the commission as anyone who may open it sees it.
// It carries only what every such viewer may see: never the owner and never the linked
// channel. Field numbers match the other commission answers where they carry the same fact.
// Number 9 and the name `linked_channel`, the linked channel's in those answers, are
// reserved here: this answer never carries the linked channel, and no other field may take
// either.
message GetCommissionResponse {
  reserved 9;
  reserved "linked_channel";

  // Opaque commission id (R6).
  string id = 1;
  // The commission's title as the Den shows it: `Unnamed` for a title stored before
  // today's name rule that the rule now refuses.
  string title = 2;
  // Lifecycle step. Vocabulary (R8): `draft` | `batched` | `active` |
  // `completed` | `cancelled` | `disputed`.
  string lifecycle = 3;
  // Who may see it. Vocabulary (R8): `private` | `listed` | `public`.
  string visibility = 4;
  // The agreed deadline, if set. Absent = no deadline, nothing more (R4).
  optional google.protobuf.Timestamp deadline = 5;
  // The maturity posture, if rated.
  optional Maturity maturity = 6;
  // Direction axis of the two-dimensional status, if set (R8 vocabulary).
  optional string direction_status = 7;
  // Deadline axis of the two-dimensional status, if any, at the time of the request
  // (R8 vocabulary): `late` once the deadline has passed on a step that isn't
  // `completed` or `cancelled`, else `delayed` when a Participant raised it. While
  // `disputed`, the clock stands at the dispute's start: `late` only when the deadline
  // had passed by then. Absent with no deadline.
  optional string deadline_status = 8;
  // When the commission was created.
  google.protobuf.Timestamp created_at = 10;
  // Whether the commission is archived.
  bool archived = 11;
  // What the viewer may do to it now, by each call's act word, in this order when present:
  // `rename` (the owner only), `move_lifecycle`, `raise_dispute`, `clear_dispute`,
  // `set_direction_status`,
  // `clear_direction_status`, `set_deadline`, `clear_deadline`, `set_delayed`,
  // `clear_delayed`. Empty for a viewer who holds no role on it. An act is listed when
  // its call would succeed for some value it takes; a listed call may still answer `204`
  // with nothing changed.
  repeated string acts = 12;
  // The steps `move_lifecycle` would really move it to now, in the vocabulary of
  // `lifecycle`; never the step it holds. Empty for a viewer who holds no role on it.
  repeated string lifecycle_targets = 13;
}

// `PUT /api/v1/commissions/{id}/lifecycle` — a Participant moves the lifecycle step.
message MoveCommissionLifecycleRequest {
  // Opaque commission id, from the path.
  string id = 1;
  // The step to move to, in the vocabulary of `GetCommissionResponse.lifecycle`. A token
  // outside it → 422 with a field error at `#/to`.
  string to = 2;
}

// `PUT .../lifecycle` succeeds `204`; there is no body.
message MoveCommissionLifecycleResponse {}

// `PUT /api/v1/commissions/{id}/dispute` — a Participant raises a dispute. There is no body.
message RaiseCommissionDisputeRequest {
  // Opaque commission id, from the path.
  string id = 1;
}

// `PUT .../dispute` succeeds `204`; there is no body.
message RaiseCommissionDisputeResponse {}

// `DELETE /api/v1/commissions/{id}/dispute` — a Participant clears the dispute, returning
// the commission to the step it left. It takes no step.
message ClearCommissionDisputeRequest {
  // Opaque commission id, from the path.
  string id = 1;
}

// `DELETE .../dispute` succeeds `204`; there is no body.
message ClearCommissionDisputeResponse {}

// `PUT /api/v1/commissions/{id}/status/direction` — a Participant sets the direction status.
message SetCommissionDirectionStatusRequest {
  // Opaque commission id, from the path.
  string id = 1;
  // The status to set (R8): `waiting_for_input` | `waiting_for_approval` |
  // `changes_requested`. A set replaces the one held.
  string status = 2;
}

// `PUT .../status/direction` succeeds `204`; there is no body.
message SetCommissionDirectionStatusResponse {}

// `DELETE /api/v1/commissions/{id}/status/direction` — a Participant clears the direction
// status.
message ClearCommissionDirectionStatusRequest {
  // Opaque commission id, from the path.
  string id = 1;
}

// `DELETE .../status/direction` succeeds `204`; there is no body.
message ClearCommissionDirectionStatusResponse {}

// `PUT /api/v1/commissions/{id}/deadline` — a Participant sets or moves the deadline.
message SetCommissionDeadlineRequest {
  // Opaque commission id, from the path.
  string id = 1;
  // The new deadline. Required.
  google.protobuf.Timestamp deadline = 2;
}

// `PUT .../deadline` succeeds `204`; there is no body.
message SetCommissionDeadlineResponse {}

// `DELETE /api/v1/commissions/{id}/deadline` — a Participant clears the deadline.
message ClearCommissionDeadlineRequest {
  // Opaque commission id, from the path.
  string id = 1;
}

// `DELETE .../deadline` succeeds `204`; there is no body.
message ClearCommissionDeadlineResponse {}

// `PUT /api/v1/commissions/{id}/status/deadline` — a Participant raises the Delayed flag.
message SetCommissionDeadlineStatusRequest {
  // Opaque commission id, from the path.
  string id = 1;
  // Only `delayed`. `late` is the system's word, derived from the deadline, and refused.
  string status = 2;
}

// `PUT .../status/deadline` succeeds `204`; there is no body.
message SetCommissionDeadlineStatusResponse {}

// `DELETE /api/v1/commissions/{id}/status/deadline` — a Participant takes the Delayed flag
// down.
message ClearCommissionDeadlineStatusRequest {
  // Opaque commission id, from the path.
  string id = 1;
}

// `DELETE .../status/deadline` succeeds `204`; there is no body.
message ClearCommissionDeadlineStatusResponse {}

// The commissions service. Session-gated: signed out, every call answers `401`.
// Problems per problem.proto. Someone who may not open a commission gets the same `404`
// (`commission_not_found`) as an id that names nothing, on every call.
service CommissionService {
  // Create a commission. `201` + the created commission, so the caller can
  // navigate straight to what it made — consistent with CreateAccount.
  rpc CreateCommission(CreateCommissionRequest) returns (CreateCommissionResponse) {
    option (google.api.http) = {
      post: "/api/v1/commissions"
      body: "*"
    };
  }

  // Owner-only rename. `200` + the renamed commission. Someone outside the
  // commission gets the same 404 as an id that names nothing; a Participant
  // who isn't the owner gets 403.
  rpc RenameCommission(RenameCommissionRequest) returns (RenameCommissionResponse) {
    option (google.api.http) = {
      patch: "/api/v1/commissions/{id}/title"
      body: "*"
    };
  }

  // Read one commission. `200` + the commission as the viewer may see it, with the acts
  // they may take. Anyone the commission doesn't open to gets the same `404` as an id that
  // names nothing.
  rpc GetCommission(GetCommissionRequest) returns (GetCommissionResponse) {
    option (google.api.http) = {
      get: "/api/v1/commissions/{id}"
    };
  }

  // Any Participant moves the lifecycle step. `204`, with nothing changed when it already
  // holds the step. `422` with a field error at `#/to` for a token outside the vocabulary,
  // before anyone's standing is checked. `404` for anyone who holds no role on it, alike
  // for an id that names nothing. `409 commission_disputed` while it is disputed; else
  // `409 lifecycle_move_refused` for a move from another step into `draft` or `disputed`.
  rpc MoveCommissionLifecycle(MoveCommissionLifecycleRequest) returns (MoveCommissionLifecycleResponse) {
    option (google.api.http) = {
      put: "/api/v1/commissions/{id}/lifecycle"
      body: "*"
    };
  }

  // Any Participant raises a dispute, from whatever step it holds, `draft` included: it stands
  // `disputed`, keeping the step it left. `204`. `404` for anyone who holds no role on it,
  // alike for an id that names nothing. `409 commission_disputed` while it is already
  // disputed.
  rpc RaiseCommissionDispute(RaiseCommissionDisputeRequest) returns (RaiseCommissionDisputeResponse) {
    option (google.api.http) = {
      put: "/api/v1/commissions/{id}/dispute"
    };
  }

  // Any Participant clears the dispute: the commission returns to exactly the step it left.
  // `204`. `404` for anyone who holds no role on it, alike for an id that names nothing.
  // `409 commission_not_disputed` when it isn't disputed.
  rpc ClearCommissionDispute(ClearCommissionDisputeRequest) returns (ClearCommissionDisputeResponse) {
    option (google.api.http) = {
      delete: "/api/v1/commissions/{id}/dispute"
    };
  }

  // Any Participant sets the direction status. `204`, with nothing changed when it already
  // holds the status. `422` for a status outside the vocabulary. `404` for anyone who holds
  // no role on it, alike for an id that names nothing.
  rpc SetCommissionDirectionStatus(SetCommissionDirectionStatusRequest) returns (SetCommissionDirectionStatusResponse) {
    option (google.api.http) = {
      put: "/api/v1/commissions/{id}/status/direction"
      body: "*"
    };
  }

  // Any Participant clears the direction status. `204`, with nothing changed when none is
  // set. `404` for anyone who holds no role on it, alike for an id that names nothing.
  rpc ClearCommissionDirectionStatus(ClearCommissionDirectionStatusRequest) returns (ClearCommissionDirectionStatusResponse) {
    option (google.api.http) = {
      delete: "/api/v1/commissions/{id}/status/direction"
    };
  }

  // Any Participant sets or moves the deadline. `204`, with nothing changed when it already
  // holds the deadline. `422` for a missing or malformed deadline. `404` for anyone who
  // holds no role on it, alike for an id that names nothing. `409 commission_disputed`
  // while it is disputed.
  rpc SetCommissionDeadline(SetCommissionDeadlineRequest) returns (SetCommissionDeadlineResponse) {
    option (google.api.http) = {
      put: "/api/v1/commissions/{id}/deadline"
      body: "*"
    };
  }

  // Any Participant clears the deadline. `204`, with nothing changed when none is set.
  // `404` for anyone who holds no role on it, alike for an id that names nothing.
  // `409 commission_disputed` while it is disputed.
  rpc ClearCommissionDeadline(ClearCommissionDeadlineRequest) returns (ClearCommissionDeadlineResponse) {
    option (google.api.http) = {
      delete: "/api/v1/commissions/{id}/deadline"
    };
  }

  // Any Participant raises the Delayed flag. `204`, with nothing changed when it is already
  // raised. `422` for any status but `delayed`. `404` for anyone who holds no role on it,
  // alike for an id that names nothing. `409 commission_late` while it stands late (see
  // `GetCommissionResponse.deadline_status`); else `409 no_deadline` when it has no deadline.
  rpc SetCommissionDeadlineStatus(SetCommissionDeadlineStatusRequest) returns (SetCommissionDeadlineStatusResponse) {
    option (google.api.http) = {
      put: "/api/v1/commissions/{id}/status/deadline"
      body: "*"
    };
  }

  // Any Participant takes the Delayed flag down. `204`, with nothing changed when it isn't
  // raised. `404` for anyone who holds no role on it, alike for an id that names nothing.
  // `409 commission_late` while it stands late (see
  // `GetCommissionResponse.deadline_status`).
  rpc ClearCommissionDeadlineStatus(ClearCommissionDeadlineStatusRequest) returns (ClearCommissionDeadlineStatusResponse) {
    option (google.api.http) = {
      delete: "/api/v1/commissions/{id}/status/deadline"
    };
  }
}
