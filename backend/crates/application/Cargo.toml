[package]
name = "application"
version = "0.1.0"
edition = "2024"
publish = false

# The use-case layer (ZMVP-205, Engineer ruling 2026-08-24): every driver
# (`api`, `cli`) calls these functions; they know the domain and its ports,
# never HTTP or a terminal. Depends on `domain` only — never on an adapter,
# never on `composition`.
[dependencies]
# The shared leaf crate (global build-time settings) — the one thing every layer may consume.
shared = { path = "../shared" }
domain = { path = "../domain" }
anyhow = { workspace = true }
# `derive(Error)` for the per-module error enums (Display/source/From by attribute).
thiserror = { workspace = true }
# `Display`/`AsRef` on the den module's output newtypes.
derive_more = { workspace = true }
# Enum string tables (`NotFoundEntity`, `AccountEntity`).
strum = { workspace = true }
# Structured logging for the steps a use case deliberately swallows (e.g. the
# retryable did:plc tombstone after a hard delete).
tracing = { workspace = true }
# Changelog entry payloads are `serde_json::Value` (the domain's own type).
serde_json = { workspace = true }
# `rt` for the task-local that guards against nested units of work, and for
# the background profile lookup's `spawn`; `time` and `sync` for that lookup's
# bounded wait and the `watch` its joiners share.
# `commission::files::upload`'s streaming seam: `AsyncRead`/`AsyncReadExt::take`
# over the caller-supplied content (ZMVP-88/205) — the neutral vocabulary that
# keeps this crate ignorant of axum's multipart types. Hand-pinned at the same
# version as `workspace.dependencies.tokio` (see `domain/Cargo.toml`'s note —
# `workspace = true` cannot itself drop `default-features` here).
tokio = { version = "1.49.0", default-features = false, features = ["io-util", "rt", "sync", "time"] }
application-macros = { path = "../application-macros" }
# The Den's engine: the den module implements its one host trait and calls its
# resolver. Imported only inside `src/den*`; no driver sees an Atta type.
atta = { path = "../atta" }
# `atta::Host` is an `#[async_trait]` trait, so its one implementation here is too.
async-trait = { workspace = true }

[dev-dependencies]
# The shared in-memory runtime (ZMVP-207) — dev-only; the dep guard checks
# normal edges, so the adapters stay out of the crate proper.
test-support = { path = "../test-support" }
# `test-util` for the profile-wait tests' paused clock.
tokio = { workspace = true, features = ["test-util"] }
uuid = { workspace = true }
# The den keys' property tests over UUIDs and DIDs, and the identity arms' name
# properties: every segment and every handle is a name.
proptest = { workspace = true }
# The tests' `now` + a hand-rolled failing port double.
chrono = { workspace = true }
# Names `composition::Runtime` so the integration tests can build an `App` over
# the in-memory fixture — already in the dev graph
# transitively via `test-support` (see the dep-guard's cyclic-dev-graph note).
composition = { path = "../composition" }
# The fixture world the Den tests walk (`adapter_mem::fixture`), and the fake
# PDS whose latency the profile-wait tests set; dev-only, so the dep guard's
# normal graph stays adapter-free.
adapter-mem = { path = "../adapter-mem" }
# The use-case log tests read what a fmt subscriber wrote.
tracing-subscriber = { workspace = true }
# The engine-exposure guard parses the crate's own sources; the node-port scan
# walks the drivers' sources token by token.
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }
