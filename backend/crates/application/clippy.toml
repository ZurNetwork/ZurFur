disallowed-methods = [
    { path = "domain::ports::Database::begin", reason = "only a `#[use_case]` wrapper, `LazyUnit` or `application::transaction()` opens units of work" },
    { path = "domain::ports::UnitOfWork::commit", reason = "only a `#[use_case]` wrapper, `LazyUnit` or `application::transaction()` settles units of work. To commit, return `Ok` from the use case" },
    { path = "domain::ports::UnitOfWork::rollback", reason = "only a `#[use_case]` wrapper, `LazyUnit` or `application::transaction()` settles units of work. To rollback, return `Err` from the use case" },
    { path = "application::transaction", reason = "a use case never opens its own unit; `transaction()` is for test seeding, with an `#[allow]` and a reason" },
    { path = "domain::ports::UnitOfWork::nodes", reason = "only the den's write gate reaches the Den's node port; a unit-of-work double that delegates, or a test that seeds or reads node rows, carries an `#[allow]` or `#[expect]` and a reason" },
    { path = "atta::DisplayName::host_checked", reason = "a name enters the engine only in `names::display_name`, from a name the Den's rule passed; a test double carries an `#[allow]` and a reason" },
    { path = "domain::ports::WriteCapability::gate_issued", reason = "only the den's write gate issues a write capability; a test double carries an `#[allow]` and a reason" },
    { path = "domain::ports::CommissionWrites::delete", reason = "a commission is deleted only through the den's write gate; today's ungated site carries an `#[expect]` until its slice gates it, and test seeding carries an `#[allow]` or `#[expect]` and a reason" },
    { path = "domain::ports::CommissionWrites::grant_view", reason = "a view grant is written only at today's one site, under its `#[expect]`, until its slice gates it; test seeding and delegating test doubles carry an `#[allow]` or `#[expect]` and a reason" },
