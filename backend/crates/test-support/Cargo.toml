[package]
name = "test-support"
version = "0.1.0"
edition = "2024"
# Test-rig crate (ZMVP-103): never published, consumed as a dev-dependency.
publish = false

[dependencies]
anyhow = { workspace = true }
# `recording`'s port wrappers implement the domain's `#[async_trait]` ports.
async-trait = { workspace = true }
# The shared PublicRecords conformance suite (ZMVP-105) is generic over the
# domain port and is run against every adapter that implements it.
domain = { path = "../domain" }
chrono = { workspace = true }
# The in-process stub PLC directory the throwaway PDS publishes identities to.
axum = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
data-encoding = { workspace = true }
# Same version testcontainers-modules 0.15 (the Postgres harness) resolves to;
# the PDS drives a GenericImage from the core crate, the shared Postgres
# harness (`pg`) drives the postgres module.
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# The shared Postgres harness migrates the template once and vends adapter-pg
# pools; the consuming adapters dev-depend back on this crate (the standard
# cargo dev-cycle).
adapter-pg = { path = "../adapter-pg" }
# The shared in-memory `Runtime` fixture (`runtime::mem`, Engineer ruling
# 2026-08-25): every driver's in-process suite boots the same fakes.
adapter-mem = { path = "../adapter-mem" }
composition = { path = "../composition" }
# `pg_app::den_world` creates its Workflows through the create use case: no route does yet.
application = { path = "../application" }
sqlx = { workspace = true }
uuid = { workspace = true }
# 0.13 + cookies so http::client() is the type the api tests use; multipart for
# `pg_app::den_world`'s uploads
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "multipart"] }
# `log_capture`: a writer a driver's log test reads its own subscriber back from.
tracing-subscriber = { workspace = true }
# the session layer the served app wraps in tests
tower-sessions = { workspace = true }
# ...built by the driver's own `session_layer`, so tests run the real session cookie
http-cookies = { path = "../http-cookies" }
# The served rigs mount the app through the stack `main` serves.
http-stack = { path = "../http-stack" }
# `cut::DropWitness`, a tower layer outside the detach layer.
tower-layer = { workspace = true }
tower-service = { workspace = true }
# Structurally-valid secp256k1 rotation key for the throwaway PDS (a random
# 32-byte string is not guaranteed to be a valid scalar) — the same vetted
# primitive the did:plc minter uses.
atrium-crypto = { workspace = true }
# The statement proxy's database URL.
url = { workspace = true }
# `pg_app::ProfileCacheState`: its names and its VARIANTS; `custody`: every Purpose.
strum = { workspace = true }
# `custody`: the test custodian's handles, derived by the dev key custodian.
adapter-hkdf = { path = "../adapter-hkdf" }
# `custody`: the test custodian's root, handed over wiped on drop.
zeroize = { workspace = true }
# `custody`'s canary: a planted root's PRK, purpose keys and key ids, computed from
# RFC 5869 over HMAC-SHA256 apart from adapter-hkdf's code.
hmac = { workspace = true }
sha2-0-11 = { workspace = true }
# `custody::signin_secrets_round_trip`: sign-in secrets sealed and opened through the
# auth store, over jacquard's OAuth records (already linked through composition).
adapter-atproto = { path = "../adapter-atproto" }
jacquard-oauth = { version = "0.12.0" }
jacquard-common = { version = "0.12.0" }
fluent-uri = { version = "0.4.1", features = ["std"] }
smol_str = "0.3.6"

[lints]
workspace = true
