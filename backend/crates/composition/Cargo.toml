[package]
publish = false
name = "composition"
version = "0.1.0"
edition = "2024"

# The composition root shared by every driving adapter (`api`, `cli`): the
# runtime `Config` and the `Runtime` bag of live ports. HTTP-free by
# construction — `tests/no_http_deps.rs` guards it (ZMVP-200).
[dependencies]
domain = { path = "../domain" }
# The transaction orchestrator `Runtime::transaction` delegates to.
application = { path = "../application" }
adapter-pg = { path = "../adapter-pg" }
adapter-atproto = { path = "../adapter-atproto" }
# The dev key custodian the custody root is derived into.
adapter-hkdf = { path = "../adapter-hkdf" }
# The custodian a command holding no purpose gets: the port is an `#[async_trait]`.
async-trait = { workspace = true }
# The custody root, wiped once the custodian has derived its keys.
zeroize = { workspace = true }
figment = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# The log filter both drivers install (`logging`): DNS-client events dropped.
tracing-subscriber = { workspace = true }
# Decode the custody root (base64) from the environment into a wiped buffer.
base64 = { workspace = true }
# Build the OAuth redirect URI from `public_url`.
fluent-uri = { workspace = true }
# `Config::public_url`: the public origin every redirect is built on.
url = { workspace = true }
# `ConfigRefusal`, the load-time environment guard's error.
thiserror = { workspace = true }
# `BareOrigin`'s `AsRef<Url>`.
derive_more = { workspace = true }

[dev-dependencies]
# `figment::Jail` — the config-precedence test.
figment = { workspace = true, features = ["test"] }
# The runtime tests await the wired handles.
tokio = { workspace = true }
# The custody tests derive every `Purpose::VARIANTS`.
strum = { workspace = true }

[lints]
workspace = true
