[package]
publish = false
name = "domain"
version = "0.1.0"
edition = "2024"

# The façade over the domain crates: every `domain::…` path resolves through
# its re-exports, and it owns only the unit of work, which vends the write
# ports of both identity and workflow.
[dependencies]
kernel = { path = "../kernel" }
identity = { path = "../identity" }
workflow = { path = "../workflow" }
async-trait = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# The guards read `cargo metadata`'s JSON.
serde_json = { workspace = true }
# The actor-port guard parses identity's and kernel's sources and walks their
# tokens; `visit` reaches every renamed import and type alias at any depth.
syn = { workspace = true, features = ["visit"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
