[package]
publish = false
name = "adapter-mem"
version = "0.1.0"
edition = "2024"

[dependencies]
domain = { path = "../domain" }
# Every port method runs in a `debug` span (`#[tracing::instrument]`, arguments skipped).
tracing = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
# Changelog entry payloads (ZMVP-87) are kind-specific JSON.
serde_json = { workspace = true }
# Minting AccountIds for the test seed helpers (e.g. seed_soft_deleted_account).
uuid = { workspace = true }
# `MemFileStore`'s streaming seam: `AsyncReadExt::read_to_end` to drain an
# upload into the fake's `Vec<u8>` map, and `Cursor`'s `AsyncRead` impl to
# stream a stored blob back out (ZMVP-88/205). `time` for `MemProfileSource`'s
# slow and silent PDS. `sync` for the bug-report filing lock a unit holds until
# it ends. Hand-pinned at the same version
# as `workspace.dependencies.tokio` (see `domain/Cargo.toml`'s note —
# `workspace = true` cannot itself drop `default-features` here).
tokio = { version = "1.49.0", default-features = false, features = ["io-util", "sync", "time"] }
# Content-addressing blobs and records in the MemPublicRecords fake (ZMVP-105):
# the same CIDv1/sha2-256 scheme the real boundary uses, so identical bytes yield
# an identical, stable CID (fidelity, not realism).
cid = { workspace = true }
sha2 = { workspace = true }
# The seeder writes a commission's fixed entries from NodeType::VARIANTS; the tests
# iterate the domain vocabularies the same way.
strum = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The shared PublicRecords conformance suite, run against MemPublicRecords.
test-support = { path = "../test-support" }

[lints]
workspace = true
