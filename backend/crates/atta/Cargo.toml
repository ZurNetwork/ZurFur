[package]
publish = false
name = "atta"
version = "0.1.0"
edition = "2024"

# Host-agnostic: never depends on another workspace crate or names a Zurfur
# type. It lives in this workspace only until it is split into its own library.
[dependencies]
async-trait = { workspace = true }
derive_more = { workspace = true }
thiserror = { workspace = true }
# The resolver's `debug` spans and its outcome events (never a path or a name).
tracing = { workspace = true }
# The names its outcome events log (`IntoStaticStr`).
strum = { workspace = true }

[dev-dependencies]
# The resolver's log tests read what a fmt subscriber wrote.
tracing-subscriber = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# Checks that a `Checked` can't be built outside Atta (tests/ui).
trybuild = { workspace = true }
