# Problem, the generated RFC 9457 type every handler returns as its error, is
# 128 bytes once it carries field errors; boxing it at every handler buys nothing.
large-error-threshold = 192

disallowed-methods = [
    { path = "tower_sessions::SessionManagerLayer::new", reason = "mount sessions through `http_cookies::session_layer`, which puts the single-session-cookie guard in front; a bare layer reads whichever of two planted pairs comes last" },
    { path = "axum::serve", reason = "serve the app through `http_stack::serve`, which runs every request to its end inside the detach layer" },
]
