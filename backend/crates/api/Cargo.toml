[package]
publish = false
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
# The contract's generated message types (src/generated, @generated by
# contract-gen; drift fails the contract_current test).
prost = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
domain = { path = "../domain" }
adapter-pg = { path = "../adapter-pg" }
# The shared composition root: Config + the Runtime port bag (ZMVP-200).
composition = { path = "../composition" }
# The use-case layer both drivers call (ZMVP-205).
application = { path = "../application" }
# The shared leaf crate (global build-time settings) — the one thing every layer may consume.
shared = { path = "../shared" }
axum = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tower-sessions = { workspace = true }
# Every cookie name and attribute, and the session layer `main` mounts.
http-cookies = { path = "../http-cookies" }
# `SetResponseHeaderLayer` (set-header feature) — the no-store cache header layer
# over the cookie surface in `app()` (ZMVP-151, CWE-525).
tower-http = { workspace = true }
# The deadline sweeper takes a Postgres transaction-scoped advisory lock
# (`pg_try_advisory_xact_lock`) for single-writer leader election across api
# instances (see `sweep.rs`); that
# is the only direct use of sqlx in this crate — reads/writes otherwise go through the
# adapter-pg ports.
sqlx = { workspace = true }
# Adapts an upload's multipart `Field` to `AsyncRead` (`StreamReader`) and a
# download's `FileDownload` reader back to a body `Stream` (`ReaderStream`) —
# the streaming FileStore seam's driver-side glue (ZMVP-88/205).
tokio-util = { workspace = true }
# `TryStreamExt::map_err`, converting a multipart field's `MultipartError`
# into `std::io::Error` ahead of `StreamReader` (ZMVP-205).
futures-util = { workspace = true }
# strum: VARIANTS over the domain vocabularies
strum = { workspace = true }
# Redirects built on the public origin (`Config::public_url`).
url = { workspace = true }
# The Den routes' own parse errors and newtypes (path-qualified derives).
thiserror = { workspace = true }
derive_more = { workspace = true }
# The dev profile's in-memory stores, fixture world and fixed sign-in; only
# the `dev-profile` feature pulls it into the binary.
adapter-mem = { path = "../adapter-mem", optional = true }

[features]
# The dev profile: the server on adapter-mem's stores seeded with the fixture
# world, sessions in memory, every sign-in alice. Never a default; the
# binary built with it refuses to start outside ZURFUR_ENV=dev.
dev-profile = ["dep:adapter-mem"]

[dev-dependencies]
# The drift gate: contract_current regenerates into a temp dir and diffs.
contract-gen = { path = "../contract-gen" }
tempfile = { workspace = true }
adapter-mem = { path = "../adapter-mem" }
# Implement port-trait test doubles (the fact-bearing unit-of-work wrapper in
# the ZMVP-66 delete tests) against the async port traits.
async-trait = { workspace = true }
# Shared template-database harness (one Postgres container per test process).
test-support = { path = "../test-support" }
# `tests/whoami_parity.rs`: the CLI's hand-copied `whoami` projection must
# render exactly like the generated `GetMeResponse` (ZMVP-203).
cli = { path = "../cli" }
# Snapshot files for the wire-shape guards (golden_wire, contract_*, parity).
insta = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "multipart"] }
