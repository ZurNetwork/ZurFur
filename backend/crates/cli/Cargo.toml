[package]
publish = false
name = "cli"
version = "0.1.0"
edition = "2024"

# `zurfur` — the terminal driving adapter (epic ZMVP-199). Links the domain and
# the live adapters IN-PROCESS through the shared `composition` root; no HTTP,
# no contract, no token. One-shot `clap` commands; the REPL is later sugar.

[[bin]]
name = "zurfur"
path = "src/main.rs"

[dependencies]
composition = { path = "../composition" }
# The use-case layer both drivers call (ZMVP-205).
application = { path = "../application" }
domain = { path = "../domain" }
adapter-pg = { path = "../adapter-pg" }
clap = { workspace = true }
clap_complete = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
figment = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The identity file: platform config dir, atomic replace, fingerprint, stamp.
directories = { workspace = true }
tempfile = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Process-level harness: spawn the real `zurfur` binary and assert on
# stdout / stderr / exit code.
assert_cmd = { workspace = true }
# In-process harness: the port bag over the in-memory fakes.
adapter-mem = { path = "../adapter-mem" }
# A real throwaway Postgres for the commands that must prove a live probe.
test-support = { path = "../test-support" }
tokio = { workspace = true }
