# Zurfur's zaf manifest (Zuri's AI Framework, teams 2.0). Nothing secret here;
# machine-private overrides go in .zaf/local.toml (git-ignored).

[project]
name = "zurfur"

[requires]
jj = "*"
gh = "*"
just = "*"
yarn = "*"

# Tickets live on the private design repo, beside the pages they cite.
[board]
kind = "github-issues"
repo = "ZurNetwork/zurfur-design"

[vcs]
kind = "jj"

[forge]
kind = "github"
repo = "ZurNetwork/ZurFur"

# The design corpus is the private sibling checkout; `index` is relative to it (the corpus keeps
# its own id → path index; this repo carries a pointer copy for readers).
[design]
kind = "git-sibling"
repo = "ZurNetwork/zurfur-design"
path = "../zurfur-design"
index = "../zurfur/docs/design-index.md"

[workspaces]
path = ".zaf/workspaces"

# Slice branches stay under feature/ so CI runs on their PRs (CLAUDE.md, "Branches and gates").
[branches]
integration = "feature/release-{version}"
task = "feature/release-{version}-{epic}-{task}"

[gate]
full = "just gate"
light = "just gate-light"
tests = "sh scripts/zaf-tests.sh {name}"

# The teams pack, installed from the ways marketplace on GitHub (ProgrammingCheetah/ways).
[pack]
tag = "2.0.0"

[runners.claude]
command = "claude -p {prompt} --model {model} --add-dir {root}"
timeout_minutes = 180

[roles.programmer]
model = "sonnet"
effort = "high"
profile = "lean"
turns = 60

[roles.team]
model = "opus"
effort = "xhigh"
profile = "build"
turns = 200
batch = 4

# CodeQL joins once default setup is enabled; CodeRabbit reviews PRs into main only, so it is not a slice step.
[check.pr]
steps = ["ci"]

[ask]
ladder = ["haiku", "sonnet"]
max = 5
cache_hours = 24

[spawn]
slots = 2
guard = [70, 85, 95]

[isolation]
kind = "process"
